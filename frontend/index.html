<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry Barokah — Kasir & Manajemen</title>
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('laundry_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<header class="topbar">
<div class="brand"><span class="logo">🧺</span>Laundry Barokah <span class="tag">OUT-01</span></div>
<nav class="nav" id="mainNav">
<a href="#/dashboard" data-tip="Ringkasan omzet & pesanan hari ini"><b class="ni"></b><span>Dasbor</span></a>
<a href="#/pos" data-tip="Kasir: buat order baru"><b class="ni"></b><span>POS</span></a>
<a href="#/orders" data-tip="Daftar & update status pesanan"><b class="ni"></b><span>Pesanan</span></a>
<a href="#/customers" data-tip="Data pelanggan"><b class="ni"></b><span>Pelanggan</span></a>
<a href="#/tracking" data-tip="Lacak pesanan via nota (publik)"><b class="ni"></b><span>Lacak</span></a>
<a href="#/laporan" data-tip="Omzet harian & grafik"><b class="ni"></b><span>Laporan</span></a>
</nav>
<div class="tools">
<button class="iconbtn" id="btnBell" data-tip="Pesanan siap diambil (klik utk filter)">🔔<span class="dot" id="bellCount" style="display:none">0</span></button>
<button class="iconbtn" id="btnTheme" data-tip="Mode gelap / terang">🌙</button>
<button class="iconbtn" id="btnLogout" data-tip="Keluar dari sesi">🚪</button>
</div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/struk.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/pos.js"></script>
<script src="js/orders.js"></script>
<script src="js/customers.js"></script>
<script src="js/tracking.js"></script>
<script src="js/laporan.js"></script>
<script>
var NAV_ICONS={dashboard:'home',pos:'cart',orders:'clipboard',customers:'users',tracking:'pin',laporan:'chart'};
document.querySelectorAll('#mainNav a').forEach(function(a){var k=a.getAttribute('href').slice(2);a.querySelector('.ni').innerHTML=ic(NAV_ICONS[k]||'dot');});
var routes={'#/dashboard':Dashboard.render,'#/pos':POS.render,'#/orders':Orders.render,'#/customers':Customers.render,'#/tracking':Tracking.render,'#/laporan':Laporan.render};
function markNav(h){document.querySelectorAll('#mainNav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')===h);});}
function router(){var h=location.hash||'#/dashboard';if(new URLSearchParams(location.search).get('code'))h='#/tracking';if(!localStorage.getItem('laundry_user')&&h!=='#/tracking'){markNav('');return Login.render();}markNav(h);(routes[h]||Dashboard.render)();}
window.addEventListener('hashchange',router);
var Login={render:function(){document.getElementById('app').innerHTML='<section class="card login"><div class="logo">🧺</div><h2 style="margin:0">Laundry Barokah</h2><p class="mut">Kasir & Manajemen — OUT-01</p><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="btn" id="btnLogin">🔓 Masuk</button><div class="demo"><button class="chip" data-pin="1111">👤 Kasir 1111</button><button class="chip" data-pin="123456">⭐ Owner 123456</button></div></section>';document.querySelectorAll('[data-pin]').forEach(function(b){b.onclick=function(){document.getElementById('pin').value=b.dataset.pin;};});document.getElementById('btnLogin').onclick=function(){Api.call('login',{pin:document.getElementById('pin').value},true).then(function(r){localStorage.setItem('laundry_user',JSON.stringify(r.user));location.hash='#/dashboard';router();startBell();}).catch(function(e){toast('⚠ '+e.message);});};}};
function toast(m,ok){var t=document.getElementById('toast');t.textContent=m;t.className='show'+(ok===false?' err':'');clearTimeout(window._tt);window._tt=setTimeout(function(){t.className='';},3200);}
function rupiah(n){return 'Rp'+Number(n||0).toLocaleString('id-ID');}
var _th=document.getElementById('btnTheme');function paintTheme(){var d=document.documentElement.getAttribute('data-theme')==='dark';_th.innerHTML=d?'☀️':'🌙';_th.setAttribute('data-tip',d?'Mode terang':'Mode gelap');}
_th.onclick=function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('laundry_theme',n);paintTheme();};
document.getElementById('btnLogout').onclick=function(){localStorage.clear();location.hash='#/tracking';clearInterval(window._bell);router();};
document.getElementById('btnBell').onclick=function(){sessionStorage.setItem('ordSt','SIAP_DIAMBIL');location.hash='#/orders';if(location.hash==='#/orders')router();};
function startBell(){clearInterval(window._bell);var up=function(){if(!localStorage.getItem('laundry_user'))return;Api.call('listOrders',{status:'SIAP_DIAMBIL'}).then(function(r){var b=document.getElementById('bellCount');b.textContent=r.length;b.style.display=r.length?'grid':'none';}).catch(function(){});};up();window._bell=setInterval(up,30000);}
paintTheme();if(localStorage.getItem('laundry_user'))startBell();router();
</script>
</body>
</html>
