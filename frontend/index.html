<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry Barokah — Kasir 1 Outlet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><div class="brand">🧺 Laundry Barokah <span>OUT-01</span></div><nav>
<a href="#/pos">POS</a><a href="#/orders">Order</a><a href="#/tracking">Tracking</a><a href="#/laporan">Laporan</a>
<button id="btnLogout">Logout</button></nav></header>
<main id="app"></main>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/struk.js"></script>
<script src="js/pos.js"></script>
<script src="js/orders.js"></script>
<script src="js/tracking.js"></script>
<script src="js/laporan.js"></script>
<script>
var routes={'#/pos':POS.render,'#/orders':Orders.render,'#/tracking':Tracking.render,'#/laporan':Laporan.render};
function router(){var h=location.hash||'#/pos';if(!localStorage.getItem('laundry_user')&&h!=='#/tracking'){return Login.render();}(routes[h]||POS.render)();}
window.addEventListener('hashchange',router);
var Login={render:function(){document.getElementById('app').innerHTML='<section class=card style=max-width:360px;margin:40px auto><h2>Login Kasir</h2><input id=pin type=password inputmode=numeric placeholder=PIN><button id=btnLogin>Login</button><p class=muted>Owner 123456 / Kasir 1111 (seed awal)</p></section>';document.getElementById('btnLogin').onclick=function(){var pin=document.getElementById('pin').value;Api.call('login',{pin:pin},true).then(function(r){localStorage.setItem('laundry_user',JSON.stringify(r.user));location.hash='#/pos';router();}).catch(function(e){toast(e.message)});}}};
document.getElementById('btnLogout').onclick=function(){localStorage.clear();location.hash='#/tracking';router();};
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='show';setTimeout(function(){t.className=''},3000);}
function rupiah(n){return 'Rp'+Number(n||0).toLocaleString('id-ID');}
router();
</script>
</body>
</html>
